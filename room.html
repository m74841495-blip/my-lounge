<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script>
(function(){
  try {
    var t = localStorage.getItem('lounge_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チャットルーム — Lounge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f6fa; --surface: #ffffff; --ink: #161a23; --muted: #6b7280; --border: #e4e8f0;
  --accent: #3762f0; --accent-dark: #2748c4; --accent-soft: #eaf0ff;
  --sans: 'Zen Kaku Gothic New', sans-serif; --mono: 'JetBrains Mono', monospace;
}
:root[data-theme="dark"] {
  --bg: #0f1117; --surface: #171a23; --ink: #edf0f7; --muted: #8d93a6; --border: #272c3a;
  --accent: #5b82ff; --accent-dark: #83a0ff; --accent-soft: rgba(91,130,255,.16);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--sans); background: var(--bg); color: var(--ink); display: flex; flex-direction: column; transition: background .2s ease, color .2s ease; }
a { color:inherit; text-decoration:none; }
button { font:inherit; cursor:pointer; }

header { background: var(--surface); border-bottom: 1px solid var(--border); height: 60px; flex: 0 0 auto; display:flex; align-items:center; justify-content:space-between; padding: 0 20px; }
.h-left { display:flex; align-items:center; gap:14px; }
.back-link { font-family: var(--mono); font-size:.78rem; color: var(--muted); }
.back-link:hover { color: var(--accent); }
.room-tag { display:flex; align-items:center; gap:8px; font-weight:900; }
.room-tag .dot { width:10px; height:10px; border-radius:50%; background: var(--accent); }
.h-right { display:flex; align-items:center; gap:16px; }
.online-count { font-family: var(--mono); font-size:.78rem; color: var(--muted); }
.theme-toggle { width:34px; height:34px; border-radius:9px; border:1.5px solid var(--border); background: var(--surface); font-size:.95rem; display:flex; align-items:center; justify-content:center; }
.theme-toggle:hover { border-color: var(--accent); }

.layout { flex:1; display:flex; min-height:0; }
.sidebar { width: 220px; flex: 0 0 auto; background: var(--surface); border-right: 1px solid var(--border); padding: 20px; overflow-y:auto; }
.sidebar h4 { font-size:.72rem; letter-spacing:.1em; color: var(--muted); font-family: var(--mono); margin-bottom:14px; }
.member { display:flex; align-items:center; gap:8px; padding:7px 0; font-size:.88rem; }
.member .m-icon { font-size:1.1rem; }
.member .me-tag { font-family: var(--mono); font-size:.62rem; color: var(--accent); margin-left:auto; }
.admin-badge { font-size: .9em; }
.sidebar-foot { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); font-size:.64rem; color: var(--muted); }

.chat-col { flex:1; display:flex; flex-direction:column; min-width:0; }
.messages { flex:1; overflow-y:auto; padding: 24px; display:flex; flex-direction:column; gap:14px; }
.msg { display:flex; gap:10px; max-width: 72%; }
.msg.me { align-self:flex-end; flex-direction:row-reverse; }
.msg .m-icon { width:34px; height:34px; border-radius:50%; background: var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex:0 0 auto; }
.msg .m-icon.admin-icon { box-shadow: 0 0 0 2px #ffc107; }
.msg .m-body { min-width:0; }
.msg .m-meta { font-family: var(--mono); font-size:.68rem; color: var(--muted); margin-bottom:4px; }
.msg.me .m-meta { text-align:right; }
.msg .m-bubble { background: var(--surface); border:1px solid var(--border); padding:10px 14px; border-radius:14px; font-size:.92rem; word-break: break-word; white-space: pre-wrap; }
.msg.me .m-bubble { background: var(--accent); color:#fff; border-color:var(--accent); }

.composer { flex: 0 0 auto; border-top: 1px solid var(--border); background: var(--surface); padding: 14px 20px; display:flex; gap:10px; }
.composer input { flex:1; border:1.5px solid var(--border); border-radius:12px; padding:12px 16px; font:inherit; font-size:.92rem; background: var(--bg); color: var(--ink); }
.composer input:focus { outline:none; border-color: var(--accent); }
.composer button { background: var(--accent); color:#fff; border:none; padding:0 24px; border-radius:12px; font-family: var(--mono); font-weight:700; font-size:.82rem; }
.composer button:hover { background: var(--accent-dark); }
.composer button:disabled { opacity:.5; cursor:default; }

.modal-overlay { position: fixed; inset:0; background: rgba(10,12,18,.55); display:flex; align-items:center; justify-content:center; z-index: 100; padding: 24px; }
.modal-box { background: var(--surface); border-radius: 20px; padding: 32px; max-width: 420px; width:100%; }
.modal-box h3 { font-size:1.1rem; font-weight:900; margin-bottom:20px; }
.modal-box label { font-size:.78rem; font-weight:700; color: var(--muted); display:block; margin-bottom:8px; }
.modal-box input[type="text"] { width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:10px; font: inherit; font-size:.95rem; margin-bottom:20px; background: var(--bg); color: var(--ink); }
.icon-grid { display:grid; grid-template-columns: repeat(8, 1fr); gap:6px; margin-bottom:24px; }
.icon-opt { aspect-ratio:1; border-radius:10px; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:1.2rem; background: var(--bg); }
.icon-opt.active { border-color: var(--accent); background: var(--accent-soft); }
.btn { font-family: var(--mono); font-size:.8rem; font-weight:700; padding:12px 20px; border-radius:10px; border:none; width:100%; background: var(--accent); color:#fff; }

@media (max-width: 760px) { .sidebar { display:none; } .msg { max-width:88%; } }
</style>
</head>
<body>

<header>
  <div class="h-left">
    <a href="index.html" class="back-link">← ロビー</a>
    <div class="room-tag" id="roomTag"><span class="dot"></span><span id="roomTitle">読み込み中…</span></div>
  </div>
  <div class="h-right">
    <span class="online-count" id="onlineCount">0人が在室</span>
    <button class="theme-toggle" id="themeToggle" aria-label="テーマ切り替え">🌙</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <h4>在室中のメンバー</h4>
    <div id="memberList"></div>
    <div class="sidebar-foot">AI-assisted development</div>
  </aside>
  <div class="chat-col">
    <div class="messages" id="messages"></div>
    <div class="composer">
      <input type="text" id="msgInput" maxlength="300" placeholder="メッセージを入力…">
      <button id="sendBtn">送信</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="entryOverlay" style="display:none;">
  <div class="modal-box">
    <h3>このルームに入室する</h3>
    <label for="nickInput">ニックネーム</label>
    <input type="text" id="nickInput" maxlength="16" placeholder="名無しさん">
    <label>アイコン</label>
    <div class="icon-grid" id="iconGrid"></div>
    <button class="btn" id="entryBtn">入室する →</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script> <!-- これを追加 -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
/* ===== Firebase設定 ===== */
const firebaseConfig = {
  apiKey: "AIzaSyB2cpviqq_bj6ZhHMrnZUokY8uEpYrAJxY",
  authDomain: "chat-d1bba.firebaseapp.com",
  databaseURL: "https://chat-d1bba-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "chat-d1bba",
  storageBucket: "chat-d1bba.firebasestorage.app",
  messagingSenderId: "765104695208",
  appId: "1:765104695208:web:ccd877076556a2a7cf1f9d"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();



/* ===== テーマ切り替え ===== */
function applyThemeIcon() {
  const t = document.documentElement.getAttribute('data-theme');
  document.getElementById('themeToggle').textContent = t === 'dark' ? '☀️' : '🌙';
}
applyThemeIcon();
document.getElementById('themeToggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('lounge_theme', next);
  applyThemeIcon();
});

/* ===== ルーム情報 ===== */
const OFFICIAL_ROOM = { id: 'general', name: '総合ラウンジ', color: '#3762f0' };
const ICONS = ['😺','🐶','🐰','🐼','🦊','🐸','🐻','🐨','🦉','🐙','🐢','🦄','👻','🤖','🌙','⭐'];
const params = new URLSearchParams(location.search); // ← ★この1行を追加！
const roomId = params.get('room') || 'general';

const ADMIN_UIDS = ['zYwUnzysADUgez4NfBgS9ht5LTu1', 'op4sq7cPWRa7zM8hNUJn2NceCVx2'];

let uid = null;
let myName = localStorage.getItem('chat_name');
let myIcon = localStorage.getItem('chat_icon');

const entryOverlay = document.getElementById('entryOverlay');
const iconGrid = document.getElementById('iconGrid');
let pickedIcon = ICONS[0];

iconGrid.innerHTML = ICONS.map(ic => `<div class="icon-opt" data-icon="${ic}">${ic}</div>`).join('');
iconGrid.querySelectorAll('.icon-opt').forEach(opt => {
  opt.addEventListener('click', () => {
    iconGrid.querySelectorAll('.icon-opt').forEach(o => o.classList.remove('active'));
    opt.classList.add('active');
    pickedIcon = opt.dataset.icon;
  });
});

// 不正なroomId対策(. # $ [ ] / を含むとFirebaseが例外を投げて止まる)
if (!/^[A-Za-z0-9_-]{1,64}$/.test(roomId)) {
  location.replace('index.html');
}

let joined = false;   // 二重入室防止

function loadRoomInfo() {
  const apply = info => {
    document.getElementById('roomTitle').textContent = info.name;
    document.querySelector('.room-tag .dot').style.background = info.color;
  };
  if (roomId === OFFICIAL_ROOM.id) { apply(OFFICIAL_ROOM); return; }

  db.ref('room_list/' + roomId).once('value')
    .then(snap => {
      const d = snap.val();
      apply(d ? { name: d.name, color: d.color || '#3762f0' }
              : { name: '不明なルーム', color: '#7f8c8d' });
    })
    .catch(err => {
      console.error('ルーム情報の取得に失敗:', err);
      apply({ name: 'ルーム', color: '#7f8c8d' });   // 失敗しても止めない
    });
}

function startRoom(u) {
  if (joined) return;
  joined = true;
  uid = u;
  entryOverlay.style.display = 'none';
  loadRoomInfo();   // ★ログイン後に読む
  joinRoom();
}

document.getElementById('roomTitle').textContent = 'ルーム';

firebase.auth().onAuthStateChanged(user => {
  if (user && myName && myIcon) {
    startRoom(user.uid);
  } else if (!joined) {
    entryOverlay.style.display = 'flex';
  }
});

document.getElementById('entryBtn').onclick = () => {
  const name = document.getElementById('nickInput').value.trim().slice(0, 16) || '名無しさん';
  firebase.auth().signInAnonymously()
    .then(cred => {
      myName = name;
      myIcon = pickedIcon;
      localStorage.setItem('chat_name', myName);
      localStorage.setItem('chat_icon', myIcon);
      startRoom(cred.user.uid);
    })
    .catch(error => {
      console.error('認証エラー:', error);
      alert('入室に失敗しました。');
    });
};

function joinRoom() {
    const presenceRef = db.ref('rooms/' + roomId + '/presence/' + uid);
  db.ref('.info/connected').on('value', snap => {
    if (!snap.val()) return;
    presenceRef.onDisconnect().remove().then(() => {
      presenceRef.set({ name: myName, icon: myIcon, time: firebase.database.ServerValue.TIMESTAMP });
    });
  });
  window.addEventListener('pagehide', () => { presenceRef.remove(); });

  db.ref('rooms/' + roomId + '/presence').on('value', snap => {
    const list = document.getElementById('memberList');
    const data = snap.val() || {};
    const keys = Object.keys(data);
    document.getElementById('onlineCount').textContent = keys.length + '人が在室';
    list.innerHTML = '';
    keys.forEach(k => {
      const m = data[k];
      const row = document.createElement('div');
      row.className = 'member';
      const iconSpan = document.createElement('span');
      iconSpan.className = 'm-icon';
      iconSpan.textContent = m.icon;
      const nameSpan = document.createElement('span');
      nameSpan.textContent = m.name;
      row.appendChild(iconSpan);
      row.appendChild(nameSpan);
      if (ADMIN_UIDS.includes(k)) {
        const badge = document.createElement('span');
        badge.className = 'admin-badge';
        badge.textContent = '👑';
        badge.title = '管理者';
        row.appendChild(badge);
      }
      if (k === uid) {
        const meTag = document.createElement('span');
        meTag.className = 'me-tag';
        meTag.textContent = 'YOU';
        row.appendChild(meTag);
      }
      list.appendChild(row);
    });
    }, err => console.error('presence取得失敗:', err));

  const messagesEl = document.getElementById('messages');
  db.ref('rooms/' + roomId + '/messages').limitToLast(100).on('child_added', snap => {
    const m = snap.val();
    if (!m) return;
    const row = document.createElement('div');
    row.className = 'msg' + (m.uid === uid ? ' me' : '');
    const iconEl = document.createElement('div');
    iconEl.className = 'm-icon' + (ADMIN_UIDS.includes(m.uid) ? ' admin-icon' : '');
    iconEl.textContent = m.icon || '🙂';
    const body = document.createElement('div');
    body.className = 'm-body';
    const meta = document.createElement('div');
    meta.className = 'm-meta';
    const time = m.time ? new Date(m.time).toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'}) : '';
    if (ADMIN_UIDS.includes(m.uid)) {
      const badge = document.createElement('span');
      badge.className = 'admin-badge';
      badge.textContent = '👑 ';
      badge.title = '管理者';
      meta.appendChild(badge);
    }
    meta.appendChild(document.createTextNode((m.name || '名無しさん') + '・' + time));
    const bubble = document.createElement('div');
    bubble.className = 'm-bubble';
    bubble.textContent = m.text || '';
    body.appendChild(meta);
    body.appendChild(bubble);
    row.appendChild(iconEl);
    row.appendChild(body);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    }, err => console.error('messages取得失敗:', err));

  const input = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
    function send() {
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = '';            // 送信と同時に入力欄をリセット
    sendBtn.disabled = true;     // 完了まで再送信を防ぐ
    db.ref('rooms/' + roomId + '/messages').push({
      uid, name: myName, icon: myIcon, text: text.slice(0, 300),
      time: firebase.database.ServerValue.TIMESTAMP
    }).catch(err => {
      console.error('送信失敗:', err.code, err.message);
      if (!input.value) input.value = text;   // 失敗時は文章を戻す
      alert('送信に失敗しました。');
    }).finally(() => {
      sendBtn.disabled = false;
      input.focus();
    });
  }
  sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) send(); });
}
</script>
</body>
</html>
